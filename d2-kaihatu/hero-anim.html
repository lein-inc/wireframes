<script>
/* タイプライター演出（日→英→日→英… ループ） */
(function () {
  var messages = [
    { text: 'はかる技術で、\nまちの未来をかたちにする。', hold: 2800 },
    { text: 'Measuring the ground.\nShaping the future.',      hold: 2800 }
  ];
  var typed = document.querySelector('.hero-copy .typed');
  if (!typed) return;
  var idx = 0;

  function render(str) { typed.innerHTML = str.replace(/\n/g, '<br>'); }

  function typeMsg(cb) {
    var msg = messages[idx].text;
    var i = 0;
    function step() {
      i++;
      render(msg.substring(0, i));
      if (i >= msg.length) { cb(); return; }
      var ch = msg[i - 1];
      var delay = (ch === '、' || ch === '。' || ch === '.') ? 260 : 85;
      setTimeout(step, delay);
    }
    step();
  }
  function deleteMsg(cb) {
    var msg = messages[idx].text;
    var i = msg.length;
    function step() {
      i--;
      render(msg.substring(0, i));
      if (i <= 0) { cb(); return; }
      setTimeout(step, 22);
    }
    step();
  }
  function loop() {
    typeMsg(function () {
      setTimeout(function () {
        deleteMsg(function () {
          idx = (idx + 1) % messages.length;
          setTimeout(loop, 300);
        });
      }, messages[idx].hold);
    });
  }
  setTimeout(loop, 550);
})();
</script>

<script>
(function () {
  var dot = document.querySelector('.cursor-dot');
  if (!dot) return;
  var x=0,y=0,tx=0,ty=0;
  window.addEventListener('mousemove', function(e){ tx=e.clientX; ty=e.clientY; });
  document.addEventListener('mouseover', function(e){ if(e.target.closest('a,button,iframe')) dot.classList.add('hover'); });
  document.addEventListener('mouseout',  function(e){ if(e.target.closest('a,button,iframe')) dot.classList.remove('hover'); });
  (function tick(){ x += (tx-x)*0.28; y += (ty-y)*0.28; dot.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%)'; requestAnimationFrame(tick); })();
  window.addEventListener('click', function(e){
    var r=document.createElement('div'); r.className='cursor-ripple';
    r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
    document.body.appendChild(r); setTimeout(function(){ r.remove(); }, 700);
  });
})();
</script>
